<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOPLAY</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4b3fc9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOPLAY">
<style>
  html, body { margin: 0; height: 100%; background: #4b3fc9; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #msg { display: none; box-sizing: border-box; padding: 32px 20px; color: #fff; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
  #msg img { width: 96px; height: 96px; }
</style>
</head>
<body>
<div id="msg"><img src="icon-192.png" alt=""><p>TOPLAY 메신저 화면의<br><b>⚙ 설정 → 앱으로 설치</b> 버튼으로 여세요.</p></div>
<script>
// TOPLAY 앱 껍데기: 구글 스크립트 화면을 주소창 없이(앱처럼) 보여 주기만 함. 대화·열쇠는 여기에 들어오지 않음.
// 처음 한 번 #u=<스크립트 주소>&<계정 열쇠> 로 열리면 기억했다가, 계정 열쇠는 화면에 한 번만 넘김 (그 뒤는 화면이 스스로 기억)
(function () {
  var K_URL = 'toplay_app_url', K_PEND = 'toplay_app_pending';
  function get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function put(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { } }
  function okUrl(u) { return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u); }
  var h = location.hash.replace(/^#/, '');
  if (h) {
    var parts = h.split('&'), u = '', rest = [];
    parts.forEach(function (p) {
      if (p.indexOf('u=') === 0) { try { u = decodeURIComponent(p.substring(2)); } catch (e) { } }
      else if (p) rest.push(p);
    });
    if (okUrl(u)) { put(K_URL, u); put(K_PEND, rest.join('&')); }
    history.replaceState(null, '', location.pathname + location.search);   // 열쇠를 주소에 남기지 않음 (설치할 때 시작 주소는 깨끗하게)
  }
  var url = get(K_URL);
  if (!okUrl(url)) { document.getElementById('msg').style.display = 'block'; return; }
  var pend = get(K_PEND);
  var f = document.createElement('iframe');
  f.allow = 'camera; microphone; clipboard-read; clipboard-write; fullscreen; autoplay; web-share; geolocation';
  f.src = url + (pend ? '#' + pend : '');
  document.body.appendChild(f);
  if (pend) f.addEventListener('load', function () { setTimeout(function () { put(K_PEND, ''); }, 15000); });
})();
</script>
</body>
</html>
