<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOPLAY</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4b3fc9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOPLAY">
<style>
  html, body { margin: 0; height: 100%; background: #4b3fc9; overflow: hidden; }
  /* 아이폰 노치·시계 영역과 아래 홈 막대 영역은 비워 둠 (안쪽 화면은 그 영역 크기를 모름) */
  iframe { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); border: 0; background: #fff; }
  #msg { display: none; box-sizing: border-box; padding: 32px 20px; color: #fff; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
  #msg img { width: 96px; height: 96px; }
</style>
</head>
<body>
<div id="msg"><img src="icon-192.png" alt=""><p>TOPLAY 메신저 화면의<br><b>⚙ 설정 → 홈 화면 추가 방법 → 앱으로 설치</b><br>버튼으로 여세요.</p></div>
<script>
// TOPLAY 앱 껍데기: 구글 스크립트 화면을 주소창 없이(앱처럼) 보여 주기만 함. 대화·열쇠는 여기에 들어오지 않음.
// 처음 한 번 #u=<스크립트 주소>&<계정 열쇠> 로 열리면 기억했다가, 계정 열쇠는 화면에 한 번만 넘김 (그 뒤는 화면이 스스로 기억)
(function () {
  var K_URL = 'toplay_app_url', K_PEND = 'toplay_app_pending', K_SEEN = 'toplay_app_seen';
  function get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function put(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { } }
  function okUrl(u) { return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u); }
  // 아이폰·아이패드: 홈 화면 앱은 사파리와 저장 공간이 따로라, 주소(#...)를 그대로 두고 그 주소로 홈 화면에 추가되게 함
  // (설치 정보 파일은 아이폰이 아닐 때만 붙임: 아이폰 사파리는 그 파일의 시작 주소를 써서 #... 정보가 빠짐)
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) { var ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = 'manifest.webmanifest'; document.head.appendChild(ml); }
  var h = location.hash.replace(/^#/, ''), pend = '', seenKey = '';
  // 아이폰 홈 화면 앱은 주소의 #... 를 버리고 열림 → 아이폰에서는 ?u=...&a=... 로 옮겨 둠
  // (? 부분은 GitHub 서버에도 가므로 자동 로그인 열쇠 ak 는 빼고 넣음 → 앱에서 처음 한 번 비밀번호 입력)
  var q = location.search.replace(/^\?/, '');
  if (ios && !h && /(?:^|&)u=/.test(q)) {
    var qu = '', qa = '';
    q.split('&').forEach(function (p) { try { if (p.indexOf('u=') === 0) qu = decodeURIComponent(p.substring(2)); else if (p.indexOf('a=') === 0) qa = decodeURIComponent(p.substring(2)); } catch (e) { } });
    h = 'u=' + encodeURIComponent(qu) + (qa ? '&' + qa : '');
  }
  if (h) {
    var parts = h.split('&'), u = '', rest = [];
    parts.forEach(function (p) {
      if (p.indexOf('u=') === 0) { try { u = decodeURIComponent(p.substring(2)); } catch (e) { } }
      else if (p && !(ios && p.indexOf('ak=') === 0)) rest.push(p);
    });
    // 아이폰은 '홈 화면에 추가'할 때 처음 열린 주소를 씀 → 주소만 바꾸지 않고 ?... 주소로 실제로 다시 엶
    if (ios && okUrl(u) && location.hash) { location.replace(location.pathname + '?u=' + encodeURIComponent(u) + (rest.length ? '&a=' + encodeURIComponent(rest.join('&')) : '')); return; }
    if (okUrl(u)) {
      put(K_URL, u);
      if (ios) { if (rest.length && get(K_SEEN) !== rest.join('&')) { pend = rest.join('&'); seenKey = pend; } }   // 처음 한 번만 넘김 (그 뒤는 화면이 스스로 기억)
      else { put(K_PEND, rest.join('&')); history.replaceState(null, '', location.pathname + location.search); }   // 열쇠를 주소에 남기지 않음 (설치할 때 시작 주소는 깨끗하게)
    }
  }
  var url = get(K_URL);
  if (!okUrl(url)) {
    var sa = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
    var m = document.getElementById('msg');
    if (ios && sa) m.querySelector('p').innerHTML = '이 아이콘에는 메신저 정보가 없습니다.<br>아이콘을 지운 뒤, <b>사파리</b>에서 TOPLAY를 열고<br><b>⚙ 설정 → 홈 화면 추가 방법 → 앱으로 설치</b><br>→ 새 창에서 공유(□↑) → <b>홈 화면에 추가</b>를 다시 해 주세요.';
    m.insertAdjacentHTML('beforeend', '<p style="opacity:.6;font-size:12px">진단: ' + (ios ? 'iOS' : 'other') + ' · ' + (sa ? 'app' : 'browser') + ' · hash ' + location.hash.length + ' · q ' + q.length + ' · v8</p>');
    m.style.display = 'block'; return;
  }
  if (!ios) pend = get(K_PEND);
  var f = document.createElement('iframe');
  f.allow = 'camera; microphone; clipboard-read; clipboard-write; fullscreen; autoplay; web-share; geolocation';
  f.src = url + (pend ? '#' + pend : '');
  document.body.appendChild(f);
  if (ios && pend && !navigator.standalone) {   // 사파리에서 열린 설치 창: 지금 이 주소 그대로 홈 화면에 추가하라고 안내
    var b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:9;background:#1d2330;color:#fff;border-radius:12px;padding:12px 40px 12px 14px;font:15px/1.5 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.3)';
    b.innerHTML = '지금 이 창에서 아래 <b>공유(□↑)</b> → <b>홈 화면에 추가</b>를 누르세요. <small style="opacity:.6">v8</small><span style="position:absolute;right:12px;top:8px;font-size:20px;cursor:pointer">×</span>';
    b.lastChild.onclick = function () { b.remove(); };
    document.body.appendChild(b);
  }
  if (pend) f.addEventListener('load', function () { setTimeout(function () { if (ios) put(K_SEEN, seenKey); else put(K_PEND, ''); }, 15000); });
})();
</script>
</body>
</html>
